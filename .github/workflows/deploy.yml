name: FE CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


env:
  IMAGE_NAME: interviewly-frontend
  REPO_URL: https://github.com/NhatLe8504/FE-Interviewly.git
  DEPLOY_DIR: /opt/interviewly-fe

jobs:
  lint-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install


      - name: Run Linter
        run: npm run lint || true

      - name: Run Typecheck
        run: npm run typecheck || true

  build:
    runs-on: ubuntu-24.04
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Application
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://be.fuji.io.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          # Frontend Environment Variables
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://be.fuji.io.vn' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_PAYMENT_QR_BANK_CODE: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_BANK_CODE || 'mb' }}
          NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER || '9394441571' }}
          NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME || 'LE VAN NHAT' }}
          NEXT_PUBLIC_PAYMENT_QR_TEMPLATE: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_TEMPLATE || 'compact2' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo '🚀 Starting deployment for Interviewly Frontend...'

            # Clone or update repository
            if [ ! -d '${{ env.DEPLOY_DIR }}' ]; then
              sudo mkdir -p '${{ env.DEPLOY_DIR }}'
              sudo chown -R \$USER:\$USER '${{ env.DEPLOY_DIR }}'
              git clone '${{ env.REPO_URL }}' '${{ env.DEPLOY_DIR }}'
            fi

            cd '${{ env.DEPLOY_DIR }}'
            git remote set-url origin '${{ env.REPO_URL }}' || true
            git fetch origin main
            git reset --hard origin/main

            # Write .env.local for Next.js build
            {
              echo \"NEXT_PUBLIC_API_BASE_URL=\$NEXT_PUBLIC_API_BASE_URL\"
              echo \"NEXT_PUBLIC_GOOGLE_CLIENT_ID=\$NEXT_PUBLIC_GOOGLE_CLIENT_ID\"
              echo \"NEXT_PUBLIC_PAYMENT_QR_BANK_CODE=\$NEXT_PUBLIC_PAYMENT_QR_BANK_CODE\"
              echo \"NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER=\$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER\"
              echo \"NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME=\$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME\"
              echo \"NEXT_PUBLIC_PAYMENT_QR_TEMPLATE=\$NEXT_PUBLIC_PAYMENT_QR_TEMPLATE\"
            } > .env.local

            # Install dependencies
            npm install --legacy-peer-deps

            # Build Next.js
            echo '⚡ Building Next.js application...'
            NODE_OPTIONS=\"--max-old-space-size=1536\" npm run build

            # Zero-downtime reload via PM2
            echo '🔄 Reloading PM2 service...'
            pm2 reload interviewly-fe || pm2 restart interviewly-fe || pm2 start npm --name \"interviewly-fe\" -- start
            pm2 save

            echo '⏳ Checking service status...'
            sleep 3
            pm2 status interviewly-fe

            echo '✅ Frontend deployment completed successfully!'
          "
