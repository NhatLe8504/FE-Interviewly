name: FE CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


env:
  IMAGE_NAME: interviewly-frontend
  REPO_URL: https://github.com/NhatLe8504/FE-Interviewly.git
  DEPLOY_DIR: /opt/interviewly-fe

jobs:
  lint-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install


      - name: Run Linter
        run: npm run lint || true

      - name: Run Typecheck
        run: npm run typecheck || true

  build:
    runs-on: ubuntu-24.04
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
          # Frontend Environment Variables
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_PAYMENT_QR_BANK_CODE: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_BANK_CODE || 'mb' }}
          NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER || '9394441571' }}
          NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME || 'LE VAN NHAT' }}
          NEXT_PUBLIC_PAYMENT_QR_TEMPLATE: ${{ secrets.NEXT_PUBLIC_PAYMENT_QR_TEMPLATE || 'compact2' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo '🚀 Starting deployment for Interviewly Frontend...'

            sudo systemctl enable --now docker 2>/dev/null || sudo service docker start 2>/dev/null || true
            sudo usermod -aG docker \$USER 2>/dev/null || true

            # Clone or update repository
            if [ ! -d '${{ env.DEPLOY_DIR }}' ]; then
              sudo mkdir -p '${{ env.DEPLOY_DIR }}'
              sudo chown -R \$USER:\$USER '${{ env.DEPLOY_DIR }}'
              git clone '${{ env.REPO_URL }}' '${{ env.DEPLOY_DIR }}'
            fi

            cd '${{ env.DEPLOY_DIR }}'
            git remote set-url origin '${{ env.REPO_URL }}' || true
            git fetch origin main
            git reset --hard origin/main

            # Write .env.local for Next.js build
            cat << 'EOF' > .env.local
NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL
NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID
NEXT_PUBLIC_PAYMENT_QR_BANK_CODE=$NEXT_PUBLIC_PAYMENT_QR_BANK_CODE
NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER=$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER
NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME=$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME
NEXT_PUBLIC_PAYMENT_QR_TEMPLATE=$NEXT_PUBLIC_PAYMENT_QR_TEMPLATE
EOF

            echo '🐳 Building and restarting Frontend container...'
            docker stop interviewly-fe 2>/dev/null || true
            docker rm interviewly-fe 2>/dev/null || true

            docker build \
              --build-arg NEXT_PUBLIC_API_BASE_URL=\"$NEXT_PUBLIC_API_BASE_URL\" \
              --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=\"$NEXT_PUBLIC_GOOGLE_CLIENT_ID\" \
              --build-arg NEXT_PUBLIC_PAYMENT_QR_BANK_CODE=\"$NEXT_PUBLIC_PAYMENT_QR_BANK_CODE\" \
              --build-arg NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER=\"$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NUMBER\" \
              --build-arg NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME=\"$NEXT_PUBLIC_PAYMENT_QR_ACCOUNT_NAME\" \
              --build-arg NEXT_PUBLIC_PAYMENT_QR_TEMPLATE=\"$NEXT_PUBLIC_PAYMENT_QR_TEMPLATE\" \
              -t ${{ env.IMAGE_NAME }}:latest .

            docker run -d \
              --name interviewly-fe \
              --restart always \
              -p 3000:3000 \
              ${{ env.IMAGE_NAME }}:latest

            echo '⏳ Checking container status...'
            sleep 3
            docker ps --filter name=interviewly-fe

            echo '✅ Frontend deployment completed successfully!'
          "
